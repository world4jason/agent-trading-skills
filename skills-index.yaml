  - TWSE
  - TPEX
  - stocks
  - ETFs
  execution_mode: codex_guided_taiwan
  integrations:
  - id: user_input
    type: local_file
    requirement: required
    note: Use the user’s actual goal, constraints and artifacts; do not infer holdings
  - id: finmind
    type: market_data
    requirement: optional
    note: Capability for Taiwan catalogue/calendar and raw financial datasets; daily prices
      are available as fallback after Yahoo in auto mode. Token, quotas and coverage vary
      by dataset; verified supplied data may also be used
  - id: yahoo
    type: market_data
    requirement: optional
    note: Auto mode tries Yahoo daily prices first; its full fundamental snapshot can fill
      available gaps. Field coverage varies; check reported price adjustment basis
