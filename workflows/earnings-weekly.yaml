schema_version: 1
id: earnings-weekly
display_name: 台股財報事件研究
market_scope:
- TWSE stocks
- TPEX stocks
- TWSE/TPEX ETFs
execution: Codex-guided Taiwan analysis; not legacy US automated runner
api_profile: local-input-or-finmind-with-yahoo-price-supplement
required_skills:
- earnings-calendar
- earnings-trade-analyzer
- technical-analyst
optional_skills: []
steps:
- step: 1
  skill: earnings-calendar
  input: Verified preceding research artifacts or user inputs; preserve TWD, dates,
    units and provenance
  output: earnings-calendar research result; incomplete when required data is absent
- step: 2
  skill: earnings-trade-analyzer
  input: Verified preceding research artifacts or user inputs; preserve TWD, dates,
    units and provenance
  output: earnings-trade-analyzer research result; incomplete when required data is
    absent
- step: 3
  skill: technical-analyst
  input: Verified preceding research artifacts or user inputs; preserve TWD, dates,
    units and provenance
  output: technical-analyst research result; incomplete when required data is absent
constraints:
- Read each skill SKILL.md before execution
- Do not substitute missing inputs or use old US runtime/calendars
- No brokerage orders or implied full-universe coverage
