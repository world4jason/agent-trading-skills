schema_version: 1
id: market-regime-daily
display_name: 台股市場狀態檢查
market_scope:
- TWSE stocks
- TPEX stocks
- TWSE/TPEX ETFs
execution: Codex-guided Taiwan analysis; not legacy US automated runner
api_profile: local-input-or-finmind-with-yahoo-price-supplement
required_skills:
- market-breadth-analyzer
- uptrend-analyzer
- exposure-coach
optional_skills: []
steps:
- step: 1
  skill: market-breadth-analyzer
  input: Verified preceding research artifacts or user inputs; preserve TWD, dates,
    units and provenance
  output: market-breadth-analyzer research result; incomplete when required data is
    absent
- step: 2
  skill: uptrend-analyzer
  input: Verified preceding research artifacts or user inputs; preserve TWD, dates,
    units and provenance
  output: uptrend-analyzer research result; incomplete when required data is absent
- step: 3
  skill: exposure-coach
  input: Verified preceding research artifacts or user inputs; preserve TWD, dates,
    units and provenance
  output: exposure-coach research result; incomplete when required data is absent
constraints:
- Read each skill SKILL.md before execution
- Do not substitute missing inputs or use old US runtime/calendars
- No brokerage orders or implied full-universe coverage
