schema_version: 1
id: strategy-research-pipeline
display_name: 台股策略研究流程
market_scope:
- TWSE stocks
- TPEX stocks
- TWSE/TPEX ETFs
execution: Codex-guided Taiwan analysis; not legacy US automated runner
api_profile: local-input-or-finmind-with-yahoo-price-supplement
required_skills:
- edge-hint-extractor
- edge-concept-synthesizer
- edge-strategy-designer
- edge-strategy-reviewer
- backtest-expert
optional_skills: []
steps:
- step: 1
  skill: edge-hint-extractor
  input: Verified preceding research artifacts or user inputs; preserve TWD, dates,
    units and provenance
  output: edge-hint-extractor research result; incomplete when required data is absent
- step: 2
  skill: edge-concept-synthesizer
  input: Verified preceding research artifacts or user inputs; preserve TWD, dates,
    units and provenance
  output: edge-concept-synthesizer research result; incomplete when required data
    is absent
- step: 3
  skill: edge-strategy-designer
  input: Verified preceding research artifacts or user inputs; preserve TWD, dates,
    units and provenance
  output: edge-strategy-designer research result; incomplete when required data is
    absent
- step: 4
  skill: edge-strategy-reviewer
  input: Verified preceding research artifacts or user inputs; preserve TWD, dates,
    units and provenance
  output: edge-strategy-reviewer research result; incomplete when required data is
    absent
- step: 5
  skill: backtest-expert
  input: Verified preceding research artifacts or user inputs; preserve TWD, dates,
    units and provenance
  output: backtest-expert research result; incomplete when required data is absent
constraints:
- Read each skill SKILL.md before execution
- Do not substitute missing inputs or use old US runtime/calendars
- No brokerage orders or implied full-universe coverage
