schema_version: 1
id: trade-memory-loop
display_name: 台股交易紀錄與回顧
market_scope:
- TWSE stocks
- TPEX stocks
- TWSE/TPEX ETFs
execution: Codex-guided Taiwan analysis; not legacy US automated runner
api_profile: local-input-or-finmind-with-yahoo-price-supplement
required_skills:
- trader-memory-core
- signal-postmortem
- trade-performance-coach
optional_skills: []
steps:
- step: 1
  skill: trader-memory-core
  input: Verified preceding research artifacts or user inputs; preserve TWD, dates,
    units and provenance
  output: trader-memory-core research result; incomplete when required data is absent
- step: 2
  skill: signal-postmortem
  input: Verified preceding research artifacts or user inputs; preserve TWD, dates,
    units and provenance
  output: signal-postmortem research result; incomplete when required data is absent
- step: 3
  skill: trade-performance-coach
  input: Verified preceding research artifacts or user inputs; preserve TWD, dates,
    units and provenance
  output: trade-performance-coach research result; incomplete when required data is
    absent
constraints:
- Read each skill SKILL.md before execution
- Do not substitute missing inputs or use old US runtime/calendars
- No brokerage orders or implied full-universe coverage
